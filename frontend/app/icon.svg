<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff75aa"/>
      <stop offset="1" stop-color="#ab7de8"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- ears (drawn first so the head merges into them) -->
  <path d="M13 31 L17 11 L30 21 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M51 31 L47 11 L34 21 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M17.5 27 L19.5 16 L26.5 21.5 Z" fill="#ffc9dd"/>
  <path d="M46.5 27 L44.5 16 L37.5 21.5 Z" fill="#ffc9dd"/>

  <!-- head -->
  <circle cx="32" cy="39" r="20" fill="#ffffff"/>

  <!-- whiskers -->
  <g stroke="#6e1740" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round">
    <path d="M9 41 h8"/><path d="M10 46 h7"/>
    <path d="M55 41 h-8"/><path d="M54 46 h-7"/>
  </g>

  <!-- eyes with sparkles -->
  <circle cx="24" cy="39" r="4.4" fill="#3d1b33"/>
  <circle cx="40" cy="39" r="4.4" fill="#3d1b33"/>
  <circle cx="25.6" cy="37.4" r="1.5" fill="#ffffff"/>
  <circle cx="41.6" cy="37.4" r="1.5" fill="#ffffff"/>
  <circle cx="22.6" cy="40.6" r=".8" fill="#ffffff" opacity=".9"/>
  <circle cx="38.6" cy="40.6" r=".8" fill="#ffffff" opacity=".9"/>

  <!-- blush -->
  <ellipse cx="17.5" cy="45.5" rx="3.6" ry="2.1" fill="#ff75aa" opacity=".55"/>
  <ellipse cx="46.5" cy="45.5" rx="3.6" ry="2.1" fill="#ff75aa" opacity=".55"/>

  <!-- nose + ω mouth -->
  <path d="M30.4 45.6 h3.2 l-1.6 2 Z" fill="#d92b70"/>
  <g stroke="#d92b70" stroke-width="1.7" stroke-linecap="round" fill="none">
    <path d="M32 47.8 v1.2"/>
    <path d="M29 49.6 q1.5 2 3 -0.2 q1.5 2.2 3 -0.2"/>
  </g>

  <!-- notary seal badge -->
  <circle cx="49" cy="15" r="7" fill="#ffe4ee" stroke="#ffffff" stroke-width="2"/>
  <g fill="#f44a8b">
    <ellipse cx="49" cy="16.6" rx="2.6" ry="2.1"/>
    <circle cx="46.6" cy="13.4" r="1.05"/>
    <circle cx="48.7" cy="12.4" r="1.05"/>
    <circle cx="50.8" cy="13.1" r="1.05"/>
    <circle cx="52.2" cy="14.8" r="1"/>
  </g>
</svg>
